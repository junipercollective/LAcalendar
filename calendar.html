<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA Social Impact Events — Juniper Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@400;500;600&family=Oranienbaum&display=swap" rel="stylesheet">
<style>
  :root {
    --green-dark:  #30523a;
    --green-sage:  #72997d;
    --gold:        #c1a55f;
    --cream:       #f2ede4;
    --cream-dark:  #e8e1d5;
    --text-dark:   #1e2e23;
    --text-mid:    #4a5e50;
    --text-light:  #7a8f80;
    --white:       #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    color: var(--text-dark);
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }

  /* ── Header ── */
  .header {
    background: var(--green-dark);
    padding: 48px 40px 36px;
  }
  .header-label {
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 12px;
  }
  .header h1 {
    font-family: 'Oranienbaum', serif;
    font-size: clamp(32px, 5vw, 52px);
    font-weight: 400;
    color: var(--cream);
    line-height: 1.1;
    max-width: 600px;
  }
  .header-sub {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-style: italic;
    font-weight: 300;
    color: var(--green-sage);
    margin-top: 12px;
  }

  /* ── Controls ── */
  .controls {
    background: var(--white);
    border-bottom: 1px solid var(--cream-dark);
    padding: 20px 40px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 320px;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-light);
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    padding: 9px 12px 9px 36px;
    border: 1px solid var(--cream-dark);
    border-radius: 4px;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    background: var(--cream);
    color: var(--text-dark);
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--green-sage); }
  .search-input::placeholder { color: var(--text-light); }

  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .filter-label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-light);
    margin-right: 2px;
  }
  .chip {
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--cream-dark);
    background: transparent;
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--green-sage); color: var(--green-dark); }
  .chip.active {
    background: var(--green-dark);
    border-color: var(--green-dark);
    color: var(--cream);
  }
  .chip.active.cost  { background: var(--gold); border-color: var(--gold); color: var(--white); }
  .chip.active.format { background: var(--green-sage); border-color: var(--green-sage); color: var(--white); }

  /* ── Main content ── */
  .main { padding: 36px 40px 60px; max-width: 1200px; }

  /* ── Loading / empty ── */
  .state-msg {
    text-align: center;
    padding: 80px 40px;
    color: var(--text-light);
  }
  .state-msg .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--cream-dark);
    border-top-color: var(--green-sage);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .state-msg p {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-style: italic;
    color: var(--text-light);
  }
  .state-msg .error-detail {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    margin-top: 8px;
    color: #c0392b;
  }

  /* ── Results count ── */
  .results-bar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--cream-dark);
  }
  .results-count {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-style: italic;
    color: var(--text-mid);
  }
  .results-count strong {
    color: var(--green-dark);
    font-style: normal;
    font-weight: 400;
  }

  /* ── Event grid ── */
  .events-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }

  /* ── Event card ── */
  .card {
    background: var(--white);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.15s, box-shadow 0.15s;
    border: 1px solid transparent;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(48, 82, 58, 0.1);
    border-color: var(--cream-dark);
  }
  .card-bar {
    height: 4px;
    flex-shrink: 0;
  }
  .card-body { padding: 20px; flex: 1; display: flex; flex-direction: column; }

  .card-meta-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
    gap: 8px;
  }
  .card-category {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-light);
  }
  .card-badges { display: flex; gap: 4px; flex-shrink: 0; }
  .badge {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 3px;
  }
  .badge-free     { background: rgba(193,165,95,0.15); color: var(--gold); }
  .badge-ticketed { background: rgba(114,153,125,0.12); color: var(--green-sage); }
  .badge-virtual  { background: rgba(48,82,58,0.08); color: var(--green-dark); }
  .badge-hybrid   { background: rgba(193,165,95,0.1); color: var(--text-mid); }

  .card-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;
    font-weight: 400;
    line-height: 1.25;
    color: var(--green-dark);
    margin-bottom: 6px;
  }
  .card-org {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text-light);
    margin-bottom: 10px;
  }
  .card-datetime {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    margin-bottom: 12px;
  }
  .card-datetime span {
    font-size: 12px;
    color: var(--text-mid);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .card-datetime svg { color: var(--green-sage); flex-shrink: 0; }

  .card-desc {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    font-weight: 300;
    line-height: 1.55;
    color: var(--text-mid);
    flex: 1;
    margin-bottom: 16px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-link {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--green-dark);
    text-decoration: none;
    border-bottom: 1px solid var(--gold);
    padding-bottom: 1px;
    transition: color 0.15s;
    align-self: flex-start;
  }
  .card-link:hover { color: var(--gold); }

  /* Category bar colors */
  .cat-climate     { background: var(--green-dark); }
  .cat-nature      { background: var(--green-sage); }
  .cat-community   { background: var(--gold); }
  .cat-education   { background: #5a7a6a; }
  .cat-wellness    { background: #a0b8a8; }
  .cat-arts        { background: #b89a6a; }
  .cat-volunteering { background: #4d7060; }
  .cat-default     { background: var(--green-sage); }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .header { padding: 32px 20px 24px; }
    .controls { padding: 16px 20px; }
    .main { padding: 24px 20px 48px; }
    .events-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-label">Juniper Collective</div>
  <h1>LA Social Impact Events</h1>
  <p class="header-sub">Climate, community, nature, and more — updated automatically</p>
</div>

<div class="controls">
  <!-- Search -->
  <div class="search-wrap">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input class="search-input" type="text" id="search" placeholder="Search events...">
  </div>

  <!-- Category chips -->
  <div class="filter-row" id="cat-filters">
    <span class="filter-label">Topic</span>
    <button class="chip active" data-cat="all">All</button>
    <button class="chip" data-cat="Climate">Climate</button>
    <button class="chip" data-cat="Nature">Nature</button>
    <button class="chip" data-cat="Community">Community</button>
    <button class="chip" data-cat="Education">Education</button>
    <button class="chip" data-cat="Wellness">Wellness</button>
    <button class="chip" data-cat="Arts">Arts</button>
    <button class="chip" data-cat="Volunteering">Volunteering</button>
  </div>

  <!-- Cost chips -->
  <div class="filter-row" id="cost-filters">
    <span class="filter-label">Cost</span>
    <button class="chip cost active" data-cost="all">All</button>
    <button class="chip cost" data-cost="Free">Free</button>
    <button class="chip cost" data-cost="Ticketed">Ticketed</button>
  </div>

  <!-- Format chips -->
  <div class="filter-row" id="format-filters">
    <span class="filter-label">Format</span>
    <button class="chip format active" data-format="all">All</button>
    <button class="chip format" data-format="In-Person">In-Person</button>
    <button class="chip format" data-format="Virtual">Virtual</button>
    <button class="chip format" data-format="Hybrid">Hybrid</button>
  </div>
</div>

<div class="main">
  <div id="state" class="state-msg">
    <div class="spinner"></div>
    <p>Loading events...</p>
  </div>
  <div id="results-bar" class="results-bar" style="display:none;">
    <span class="results-count" id="count-label"></span>
  </div>
  <div class="events-grid" id="grid"></div>
</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSDPUhIDqWXkMLZ7LWTBRIlkOpNiZaDGVIDq5IFsn2h4oqrHoTq-hhht2j_mG2nxyI_K2nG0K1IvDYU/pub?gid=1791053541&single=true&output=csv";

let allEvents = [];
let activeCategory = "all";
let activeCost     = "all";
let activeFormat   = "all";
let searchQuery    = "";

// ── CSV parser (handles quoted fields with commas) ──────────────────────────
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const headers = splitCSVLine(lines[0]);
  return lines.slice(1).map(line => {
    const values = splitCSVLine(line);
    const obj = {};
    headers.forEach((h, i) => { obj[h.trim()] = (values[i] || "").trim(); });
    return obj;
  });
}

function splitCSVLine(line) {
  const result = [];
  let cur = "", inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQuote && line[i+1] === '"') { cur += '"'; i++; }
      else { inQuote = !inQuote; }
    } else if (ch === ',' && !inQuote) {
      result.push(cur); cur = "";
    } else { cur += ch; }
  }
  result.push(cur);
  return result;
}

// ── Date helpers ────────────────────────────────────────────────────────────
function parseDate(str) {
  // expects YYYY-MM-DD
  if (!str) return null;
  const [y, m, d] = str.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function formatDate(str) {
  const d = parseDate(str);
  if (!d) return str;
  return d.toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric" });
}

function formatTime(str) {
  if (!str) return "";
  const [h, m] = str.split(":").map(Number);
  if (isNaN(h)) return str;
  const ampm = h >= 12 ? "PM" : "AM";
  const hour = h % 12 || 12;
  return `${hour}:${String(m).padStart(2,"0")} ${ampm}`;
}

function isUpcoming(dateStr) {
  const d = parseDate(dateStr);
  if (!d) return false;
  const today = new Date();
  today.setHours(0,0,0,0);
  return d >= today;
}

// ── Category bar color ───────────────────────────────────────────────────────
function catClass(cat) {
  const map = {
    "Climate":"cat-climate","Nature":"cat-nature","Community":"cat-community",
    "Education":"cat-education","Wellness":"cat-wellness","Arts":"cat-arts",
    "Volunteering":"cat-volunteering"
  };
  return map[cat] || "cat-default";
}

// ── Render card ──────────────────────────────────────────────────────────────
function renderCard(ev) {
  const cost   = (ev.Cost   || "").trim();
  const fmt    = (ev.Format || "In-Person").trim();
  const link   = (ev.Link   || "").trim();

  const costBadge   = cost   ? `<span class="badge badge-${cost.toLowerCase()}">${cost}</span>` : "";
  const formatBadge = (fmt && fmt !== "In-Person")
    ? `<span class="badge badge-${fmt.toLowerCase().replace("-","")}">${fmt}</span>` : "";

  const dateStr = ev.Date ? formatDate(ev.Date) : "";
  const timeStr = ev.Time ? formatTime(ev.Time) : "";
  const area    = (ev.Area || "").trim();

  const dateIcon = `<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`;
  const timeIcon = `<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`;
  const pinIcon  = `<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`;

  const desc = (ev.Description || "").trim();
  const linkEl = link ? `<a class="card-link" href="${link}" target="_blank" rel="noopener">Register &rarr;</a>` : "";

  return `
<div class="card">
  <div class="card-bar ${catClass(ev.Category)}"></div>
  <div class="card-body">
    <div class="card-meta-top">
      <span class="card-category">${ev.Category || ""}</span>
      <div class="card-badges">${costBadge}${formatBadge}</div>
    </div>
    <div class="card-title">${ev.Title || "Untitled Event"}</div>
    <div class="card-org">${ev.Organization || ""}</div>
    <div class="card-datetime">
      ${dateStr ? `<span>${dateIcon}${dateStr}</span>` : ""}
      ${timeStr ? `<span>${timeIcon}${timeStr}</span>` : ""}
      ${area    ? `<span>${pinIcon}${area}</span>`    : ""}
    </div>
    ${desc   ? `<div class="card-desc">${desc}</div>` : ""}
    ${linkEl}
  </div>
</div>`;
}

// ── Filter + render ──────────────────────────────────────────────────────────
function render() {
  const q = searchQuery.toLowerCase();
  const filtered = allEvents.filter(ev => {
    if (activeCategory !== "all" && ev.Category !== activeCategory) return false;
    if (activeCost     !== "all" && ev.Cost !== activeCost)         return false;
    if (activeFormat   !== "all") {
      const fmt = ev.Format || "In-Person";
      if (fmt !== activeFormat) return false;
    }
    if (q) {
      const haystack = [ev.Title, ev.Organization, ev.Description, ev.Area, ev.Category]
        .join(" ").toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });

  const grid = document.getElementById("grid");
  const bar  = document.getElementById("results-bar");
  const lbl  = document.getElementById("count-label");

  if (filtered.length === 0) {
    grid.innerHTML = "";
    bar.style.display = "none";
    document.getElementById("state").style.display = "block";
    document.getElementById("state").innerHTML = `<p>No events match your filters.</p>`;
    return;
  }

  document.getElementById("state").style.display = "none";
  bar.style.display = "flex";
  lbl.innerHTML = `<strong>${filtered.length}</strong> upcoming event${filtered.length !== 1 ? "s" : ""}`;
  grid.innerHTML = filtered.map(renderCard).join("");
}

// ── Load CSV ─────────────────────────────────────────────────────────────────
async function loadEvents() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const rows = parseCSV(text);

    allEvents = rows
      .filter(r => (r.Active || "").trim().toLowerCase() === "yes")
      .filter(r => isUpcoming(r.Date))
      .sort((a, b) => {
        const da = parseDate(a.Date), db = parseDate(b.Date);
        return da - db;
      });

    document.getElementById("state").style.display = "none";
    render();
  } catch (err) {
    console.error(err);
    document.getElementById("state").innerHTML = `
      <p>Could not load events.</p>
      <p class="error-detail">${err.message}</p>`;
  }
}

// ── Event listeners ──────────────────────────────────────────────────────────
document.getElementById("search").addEventListener("input", e => {
  searchQuery = e.target.value;
  render();
});

document.getElementById("cat-filters").addEventListener("click", e => {
  if (!e.target.dataset.cat) return;
  activeCategory = e.target.dataset.cat;
  document.querySelectorAll("[data-cat]").forEach(el => el.classList.remove("active"));
  e.target.classList.add("active");
  render();
});

document.getElementById("cost-filters").addEventListener("click", e => {
  if (!e.target.dataset.cost) return;
  activeCost = e.target.dataset.cost;
  document.querySelectorAll("[data-cost]").forEach(el => el.classList.remove("active"));
  e.target.classList.add("active");
  render();
});

document.getElementById("format-filters").addEventListener("click", e => {
  if (!e.target.dataset.format) return;
  activeFormat = e.target.dataset.format;
  document.querySelectorAll("[data-format]").forEach(el => el.classList.remove("active"));
  e.target.classList.add("active");
  render();
});

// ── Init ─────────────────────────────────────────────────────────────────────
loadEvents();
</script>
</body>
</html>
