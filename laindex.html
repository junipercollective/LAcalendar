<style>
  :root {
    --green-dark:  #30523a;
    --green-sage:  #72997d;
    --gold:        #c1a55f;
    --cream:       #f2ede4;
    --cream-dark:  #e8e1d5;
    --page-bg:     #fcfaf3;
    --text-dark:   #1e2e23;
    --text-mid:    #4a5e50;
    --text-light:  #7a8f80;
    --white:       #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--page-bg); color: var(--text-dark); font-family: 'Montserrat', sans-serif; font-size: 14px; line-height: 1.6; }

  /* Header */
  .header { background: var(--green-dark); padding: 48px 40px 36px; }
  .header-label { font-size: 10px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; }
  .header h1 { font-family: 'Oranienbaum', serif; font-size: clamp(30px, 5vw, 50px); font-weight: 400; color: var(--cream); line-height: 1.1; max-width: 600px; text-transform: uppercase; letter-spacing: 0.04em; }
  .header-sub { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-style: italic; font-weight: 300; color: var(--green-sage); margin-top: 12px; }

  /* Controls (sticky group that grows when a panel is open) */
  .controls { background: var(--white); border-bottom: 1px solid var(--cream-dark); position: sticky; top: 0; z-index: 100; }
  .controls-inner { padding: 18px 40px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }

  /* Search */
  .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 300px; }
  .search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-light); pointer-events: none; }
  .search-input { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid var(--cream-dark); border-radius: 4px; font-family: 'Montserrat', sans-serif; font-size: 12px; background: var(--cream); color: var(--text-dark); outline: none; }
  .search-input:focus { border-color: var(--green-sage); }
  .search-input::placeholder { color: var(--text-light); }

  /* Filter triggers row */
  .filter-triggers { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex: 1; }
  .filter-trigger {
    padding: 7px 14px; border-radius: 20px;

  .filter-trigger:hover { border-color: var(--green-sage); color: var(--green-dark); }
  .filter-trigger.active { background: var(--green-dark); border-color: var(--green-dark); color: var(--cream); }
  .filter-trigger.open { border-color: var(--green-dark); }
  .filter-count {

    font-size: 11px; font-weight: 600;

  .filter-trigger.active .filter-count { background: rgba(242,237,228,0.25); color: var(--cream); }

  .clear-btn { font-size: 11px; font-weight: 500; color: var(--text-light); background: none; border: none; cursor: pointer; text-decoration: underline; padding: 4px 8px; white-space: nowrap; font-family: 'Montserrat', sans-serif; }
  .clear-btn:hover { color: var(--green-dark); }

  /* Panels (in sticky group, below triggers) */
  .filter-panel {

  /* Year / Month panel */
  .ym-block { margin-bottom: 14px; }
  .ym-block:last-child { margin-bottom: 0; }
  .ym-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-light); margin-bottom: 8px; }

  .card-body { padding: 18px; flex: 1; display: flex; flex-direction: column; }

  /* All categories share the sage background. Per-category colors were

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSDPUhIDqWXkMLZ7LWTBRIlkOpNiZaDGVIDq5IFsn2h4oqrHoTq-hhht2j_mG2nxyI_K2nG0K1IvDYU/pub?gid=1791053541&single=true&output=csv";

let allEvents   = [];
let activeCategories = new Set();
let activeCosts      = new Set();
let activeCities     = new Set();
let activeRegions    = new Set();
let activeYears      = new Set();
let activeMonths     = new Set();
let virtualState     = "all"; // "all" | "only" | "hide"
let searchQuery = "";

// ── Image library (flat folder, shuffled, assigned by card position) ────────
// All images live in one folder: images/1.png .. images/{IMAGE_POOL_SIZE}.png,
// not tied to topics. Images are handed out by card position walking a fixed
// shuffled order of the pool, which gives three things:
//   - every image is used once before any repeats (least duplication),
//   - a repeat only happens IMAGE_POOL_SIZE cards later, so never adjacent, and
//   - because the order is shuffled, sequentially named lookalikes (1 next to
//     2) never land side by side.
// To add or remove images, change IMAGE_POOL_SIZE to match how many files are
// in the folder (named 1..N). Change IMAGE_EXT if they aren't .png.
const IMAGE_POOL_SIZE = 130;
const IMAGE_EXT = "png";

// Deterministic shuffle of [1..n]. Fixed seed, so the order is stable across
// page loads (no flicker) but looks random.
function shuffledPool(n) {
  const arr = Array.from({ length: n }, (_, i) => i + 1);
  let seed = 0x9e3779b9;
  const rand = () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  for (let i = n - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
const IMAGE_ORDER = shuffledPool(IMAGE_POOL_SIZE);

function pickImage(position) {
  if (!IMAGE_POOL_SIZE) return null;
  const n = IMAGE_ORDER[position % IMAGE_POOL_SIZE];
  return `images/${n}.${IMAGE_EXT}`;
}

// ── City / state / zip extraction from a free-text address ──────────────────
function extractCityStateZip(address) {
  if (!address) return "";
  const match = address.match(/([A-Za-z][A-Za-z\s.'-]+),\s*([A-Z]{2})(?:\s+(\d{5}))?[^,]*$/);
  if (match) {
    const city = match[1].trim();
    const state = match[2];
    const zip = match[3];
    return zip ? `${city}, ${state} ${zip}` : `${city}, ${state}`;
  }
  return address;
}

// ── Price formatting ─────────────────────────────────────────────────────────
// Normalizes whatever's in the Cost cell into one of three display states:
//   "Free"      — empty, "Free", or any zero amount including "$0 USD", "0.00"
//   "$NN"       — any real price, cleaned (e.g. "$25 USD" -> "$25", ranges -> "$10-50")
//   "Ticketed"  — paid but no number given (Donation, "Ticketed", "TBD", etc.)
function formatPrice(cost) {
  if (!cost) return "Free";
  let c = String(cost).trim();
  if (/^free$/i.test(c)) return "Free";
  // Drop thousands commas and a trailing currency code/word ("$25 USD" -> "$25").
  c = c.replace(/,/g, "").replace(/\s*(usd|us\$|dollars?)\s*$/i, "").trim();
  // Pull out every numeric amount (handles "$0", "0.00", "$25", "$10-50", "$0 USD").
  const nums = (c.match(/\d+(?:\.\d+)?/g) || []).map(Number);
  // Numbers present and all zero -> functionally free.
  if (nums.length && nums.every(n => n === 0)) return "Free";
  // At least one real price -> show it cleanly as $N or $N-M.
  const nonzero = nums.filter(n => n > 0);
  if (nonzero.length) {
    const fmt = n => "$" + (Number.isInteger(n) ? n : n.toFixed(2));
    const lo = Math.min(...nonzero), hi = Math.max(...nonzero);
    return lo === hi ? fmt(lo) : `${fmt(lo)}-${hi}`;
  }
  // No usable number ("Ticketed", "Donation", "TBD") -> uniform "Ticketed".
  return "Ticketed";
}

// ── CSV parser ───────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const headers = splitLine(lines[0]);
  return lines.slice(1).map(line => {
    const vals = splitLine(line);
    const obj = {};
    headers.forEach((h, i) => { obj[h.trim()] = (vals[i] || "").trim(); });
    return obj;
  });
}
function splitLine(line) {
  const res = []; let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (q && line[i+1] === '"') { cur += '"'; i++; } else q = !q; }
    else if (c === ',' && !q) { res.push(cur); cur = ""; }
    else cur += c;
  }
  res.push(cur); return res;
}

// ── Date helpers ─────────────────────────────────────────────────────────────
function parseDate(str) {
  if (!str) return null;
  str = str.trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
    const [y,m,d] = str.split("-").map(Number);
    return new Date(y, m-1, d);
  }
  if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(str)) {
    const [m,d,y] = str.split("/").map(Number);
    return new Date(y, m-1, d);
  }
  const monthNames = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  const mMatch = str.match(/([A-Za-z]+)\s+(\d{1,2})/);
  if (mMatch) {
    const mIdx = monthNames.indexOf(mMatch[1].toLowerCase().slice(0,3));
    if (mIdx !== -1) {
      const day = parseInt(mMatch[2]);
      const now = new Date();
      let d = new Date(now.getFullYear(), mIdx, day);
      if (d < now) d = new Date(now.getFullYear()+1, mIdx, day);
      return d;
    }
  }
  const fullMatch = str.match(/([A-Za-z]+)\s+(\d{1,2}),?\s+(\d{4})/);
  if (fullMatch) {
    const mIdx = monthNames.indexOf(fullMatch[1].toLowerCase().slice(0,3));
    if (mIdx !== -1) return new Date(parseInt(fullMatch[3]), mIdx, parseInt(fullMatch[2]));
  }
  return null;
}

function isUpcoming(d) {
  if (!d) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return d >= today;
}

function formatDate(d) {
  return d.toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric" });
}
function formatTime(str) {
  if (!str) return "";
  const [h,m] = str.split(":").map(Number);
  if (isNaN(h)) return str;
  const ap = h >= 12 ? "PM" : "AM";
  return `${h%12||12}:${String(m).padStart(2,"0")} ${ap}`;
}

// ── Year / Month filter helpers ──────────────────────────────────────────────
// Each event has a single date (ev._date). Events are already filtered to
// upcoming, so the derived years/months are inherently current-and-forward.
function evYM(ev) {
  return ev._date ? ev._date.getFullYear() + "-" + String(ev._date.getMonth()+1).padStart(2,"0") : null;
}
function yearOptions() {
  return [...new Set(allEvents.map(e => e._date ? String(e._date.getFullYear()) : null).filter(Boolean))].sort();
}
function monthOptionsForYears(years) {
  return [...new Set(allEvents.map(evYM).filter(ym => ym && years.has(ym.slice(0,4))))].sort();
}
function monthLabel(ym, withYear) {
  const p = ym.split("-").map(Number);
  return new Date(p[0], p[1]-1, 1).toLocaleDateString("en-US", withYear ? { month:"short", year:"2-digit" } : { month:"short" });
}
function updateWhenCount() {
  const trig = document.querySelector('[data-filter="when"]');
  if (!trig) return;
  const n = activeYears.size + activeMonths.size;
  const countEl = trig.querySelector(".filter-count");
  if (n > 0) { countEl.textContent = n; countEl.style.display = "inline-block"; trig.classList.add("active","has-selections"); }
  else { countEl.style.display = "none"; trig.classList.remove("active","has-selections"); }
}
// Month chips are scoped to the selected year(s); rebuilt when years change.
function renderMonthChips() {
  const container = document.getElementById("month-options");
  const hint = document.getElementById("month-hint");
  if (!activeYears.size) { container.innerHTML = ""; hint.style.display = "block"; return; }
  hint.style.display = "none";
  const months = monthOptionsForYears(activeYears);
  const multi = activeYears.size > 1;
  container.innerHTML = months.map(m =>
    `<button class="option${activeMonths.has(m) ? " selected" : ""}" data-month="${m}">${monthLabel(m, multi)}</button>`
  ).join("");
  container.querySelectorAll("[data-month]").forEach(btn => {
    btn.addEventListener("click", () => {
      const m = btn.dataset.month;
      if (activeMonths.has(m)) { activeMonths.delete(m); btn.classList.remove("selected"); }
      else { activeMonths.add(m); btn.classList.add("selected"); }
      updateWhenCount(); render();
    });
  });
}
function buildYearChips() {
  const container = document.getElementById("year-options");
  container.innerHTML = yearOptions().map(y =>
    `<button class="option" data-year="${y}">${y}</button>`
  ).join("");
  container.querySelectorAll("[data-year]").forEach(btn => {
    btn.addEventListener("click", () => {
      const y = btn.dataset.year;
      if (activeYears.has(y)) {
        activeYears.delete(y); btn.classList.remove("selected");
        [...activeMonths].forEach(m => { if (m.slice(0,4) === y) activeMonths.delete(m); }); // drop that year's months
      } else { activeYears.add(y); btn.classList.add("selected"); }
      renderMonthChips(); updateWhenCount(); render();
    });
  });
}

// ── Category bar color class ─────────────────────────────────────────────────
function catClass(cat) {
  const map = {
    "Arts & Culture":            "cat-artsculture",
    "Climate & Sustainability":  "cat-climate",
    "Community":                 "cat-community",
    "CSR & Responsible Business":"cat-csrbusiness",
    "Energy & Tech":             "cat-energy",
    "Finance":                   "cat-finance",
    "Justice & Equity":          "cat-justiceequity",
    "Nature":                    "cat-nature",
    "Ocean & Coastal":           "cat-ocean",
    "Social Entrepreneurship":   "cat-socialentrepreneurship",
    "Social Impact":             "cat-socialimpact",
    "Women":                     "cat-women",
    // Legacy keys for back-compat with old sheet rows
    "Climate":                   "cat-climate",
    "Ocean":                     "cat-ocean",
    "Arts":                      "cat-artsculture",
    "Education":                 "cat-education",
    "Wellness":                  "cat-wellness",
    "Volunteering":              "cat-volunteering"
  };
  return map[cat] || "cat-default";
}

// ── Split multi-category cell into array ─────────────────────────────────────
// Category column may hold one category ("Climate & Sustainability") or several
// comma-separated ("Climate & Sustainability, Women, Community"). Returns the
// list trimmed and de-empty'd. Supports comma, semicolon, or pipe as separator.
function getEventCategories(ev) {
  return (ev.Category || "")
    .split(/[,;|]/)
    .map(c => c.trim())
    .filter(Boolean);
}

// ── Build City chips from data ───────────────────────────────────────────────
function buildCityChips(events) {
  const container = document.getElementById("city-options");
  // Read from City (new column) or Area (legacy column) for back-compat
  const cities = [...new Set(
    events
      .map(e => (e.City || e.Area || "").trim())
      .filter(c => c && !/\d/.test(c) && c.length < 40) // exclude raw addresses
  )].sort((a,b) => a === "Online" ? 1 : b === "Online" ? -1 : a.localeCompare(b));

  container.innerHTML = cities.map(c =>
    `<button class="option" data-city="${c.replace(/"/g,'&quot;')}">${c}</button>`
  ).join("");

  container.querySelectorAll("[data-city]").forEach(btn => {
    btn.addEventListener("click", () => toggleMulti(activeCities, btn.dataset.city, btn, "city"));
  });
}

// ── Build Region chips from data ─────────────────────────────────────────────
// Only shows regions that have at least one event in the data (dynamic).
// Excludes "Unknown - Needs Review" so it doesn't appear as a public filter.
function buildRegionChips(events) {
  const container = document.getElementById("region-options");
  const regions = [...new Set(
    events
      .map(e => (e.Region || "").trim())
      .filter(r => r && r !== "Unknown - Needs Review")
  )].sort((a,b) => a === "Online" ? 1 : b === "Online" ? -1 : a.localeCompare(b));

  container.innerHTML = regions.map(r =>
    `<button class="option" data-region="${r.replace(/"/g,'&quot;')}">${r}</button>`
  ).join("");

  container.querySelectorAll("[data-region]").forEach(btn => {
    btn.addEventListener("click", () => toggleMulti(activeRegions, btn.dataset.region, btn, "region"));
  });
}

// ── Filter trigger panel toggle ──────────────────────────────────────────────
function setupFilterTriggers() {
  const triggers = document.querySelectorAll(".filter-trigger");
  const panels = document.querySelectorAll(".filter-panel");

  triggers.forEach(t => {
    t.addEventListener("click", () => {
      const target = t.dataset.filter;
      const wasOpen = t.classList.contains("open");
      triggers.forEach(tr => tr.classList.remove("open"));
      panels.forEach(p => p.classList.remove("open"));
      if (!wasOpen) {
        t.classList.add("open");
        document.querySelector(`[data-panel="${target}"]`).classList.add("open");
      }
    });
  });

  // Close panels when clicking outside the controls bar
  document.addEventListener("click", e => {
    if (!e.target.closest(".controls")) {
      triggers.forEach(tr => tr.classList.remove("open"));
      panels.forEach(p => p.classList.remove("open"));
    }
  });
}

// ── Filter selection handlers ────────────────────────────────────────────────
function toggleMulti(set, value, btn, filterKey) {
  if (set.has(value)) { set.delete(value); btn.classList.remove("selected"); }
  else { set.add(value); btn.classList.add("selected"); }
  updateTriggerCount(filterKey, set.size);
  render();
}

function setVirtualState(value) {
  virtualState = value;
  document.querySelectorAll('[data-virtual]').forEach(b => {
    b.classList.toggle("selected", b.dataset.virtual === value);
  });
  // Trigger shows active state only if not "all"
  const trig = document.querySelector('[data-filter="virtual"]');
  if (value === "all") {
    trig.classList.remove("active", "has-selections");
    trig.querySelector(".filter-count").style.display = "none";
  } else {
    trig.classList.add("active");
    // Use a dot indicator instead of count for tri-state
    const label = value === "only" ? "•" : "—";
    const countEl = trig.querySelector(".filter-count");
    countEl.textContent = label;
    countEl.style.display = "inline-block";
  }
  render();
}

function updateTriggerCount(filterKey, count) {
  const trig = document.querySelector(`[data-filter="${filterKey}"]`);
  const countEl = trig.querySelector(".filter-count");
  if (count > 0) {
    countEl.textContent = count;
    countEl.style.display = "inline-block";
    trig.classList.add("active", "has-selections");
  } else {
    countEl.style.display = "none";
    trig.classList.remove("active", "has-selections");
  }
}

// ── Card render ──────────────────────────────────────────────────────────────
function renderCard(ev, position) {
  const fmt    = (ev.Format || "In-Person").trim();
  const link   = (ev.Link || "").trim();
  const city   = (ev.City || ev.Area || "").trim();

  const dateStr = ev._date ? formatDate(ev._date) : "";
  const timeStr = ev.Time  ? formatTime(ev.Time)  : "";

  // Location line: virtual shows "Online", anything that means "no real city"
  // (empty, TBD, Unknown, "Unknown - Needs Review", any casing) shows
  // "Location TBD". Otherwise pull city/state/zip out of the address.
  let locationStr = "";
  const cityNorm = (city || "").trim().toLowerCase();
  const tbdValues = ["", "tbd", "unknown", "unknown - needs review"];
  if (fmt === "Virtual" || city === "Online") {
    locationStr = "Online";
  } else if (tbdValues.includes(cityNorm)) {
    locationStr = "Location TBD";
  } else {
    locationStr = extractCityStateZip(city);
  }

  // Categories: show all on the card label, use first one for image + color bar
  const cats = getEventCategories(ev);
  const primaryCat = cats[0] || "";
  const categoryDisplay = cats.join(" · ");
  const catCls = catClass(primaryCat);

  // Image: assigned by card position from the shuffled pool; falls back to the
  // solid sage block if the file is missing (e.g. IMAGE_POOL_SIZE set too high)
  const imgPath = pickImage(position);
  const imgHtml = imgPath
    ? `<img src="${imgPath}" alt="" onerror="this.style.display='none';this.parentNode.classList.add('${catCls}');">`
    : "";

  // Price pill
  const price = formatPrice(ev.Cost);

  // Format tag (only show if not plain In-Person, sits in card body)
  const formatTag = fmt === "Hybrid"
    ? `<span class="card-format-tag">Hybrid</span>`
    : fmt === "Virtual"
    ? `<span class="card-format-tag" style="background:rgba(48,82,58,0.08);color:var(--green-dark);">Virtual</span>`
    : "";

  const calIcon  = `<svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`;
  const timeIcon = `<svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`;
  const pinIcon  = `<svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`;

  return `
<div class="card">
  <div class="card-image ${catCls}">
    ${imgHtml}
    <span class="card-price">${price}</span>
  </div>
  <div class="card-body">
    <div class="card-meta-top">
      <span class="card-category">${categoryDisplay}</span>
      ${formatTag}
    </div>
    <div class="card-title">${ev.Title || "Untitled Event"}</div>
    <div class="card-org">${ev.Organization || ""}</div>
    <div class="card-datetime">
      ${dateStr ? `<span>${calIcon}${dateStr}</span>` : ""}
      ${timeStr ? `<span>${timeIcon}${timeStr}</span>` : ""}
      ${locationStr ? `<span>${pinIcon}${locationStr}</span>` : ""}
    </div>
    ${ev.Description ? `<div class="card-desc">${ev.Description}</div>` : ""}
    ${link ? `<a class="card-link" href="${link}" target="_blank" rel="noopener">Register &rarr;</a>` : ""}
  </div>
</div>`;
}

// ── Main render with filters applied ────────────────────────────────────────
function render() {
  const q = searchQuery.toLowerCase();
  const filtered = allEvents.filter(ev => {
    // Topic filter: pass if ANY of the event's categories matches ANY active filter
    if (activeCategories.size) {
      const evCats = getEventCategories(ev);
      if (!evCats.some(c => activeCategories.has(c))) return false;
    }
    // Cost filter: chips are "Free" and "Ticketed" categories, but the data
    // can hold real prices like "$15" or "$10-50". Treat anything non-Free
    // and non-empty as Ticketed for filter purposes.
    if (activeCosts.size) {
      const cost = (ev.Cost || "").trim();
      const isFree = !cost || cost.toLowerCase() === "free";
      const matches = (isFree && activeCosts.has("Free"))
                   || (!isFree && activeCosts.has("Ticketed"));
      if (!matches) return false;
    }

    // Virtual tri-state — Hybrid counts as both Virtual and In-Person,
    // so it shows in "only virtual" and "hide virtual" alike
    const fmt = (ev.Format || "In-Person").trim();
    if (virtualState === "only" && fmt !== "Virtual" && fmt !== "Hybrid") return false;
    if (virtualState === "hide" && fmt === "Virtual") return false;

    // City filter
    if (activeCities.size) {
      const city = (ev.City || ev.Area || "").trim();
      if (!activeCities.has(city)) return false;
    }

    // Region filter
    if (activeRegions.size) {
      const region = (ev.Region || "").trim();
      if (!activeRegions.has(region)) return false;
    }

    // Year filter
    if (activeYears.size) {
      const y = ev._date ? String(ev._date.getFullYear()) : "";
      if (!activeYears.has(y)) return false;
    }

    // Month filter (specific year-month, e.g. "2026-06")
    if (activeMonths.size) {
      const ym = evYM(ev);
      if (!ym || !activeMonths.has(ym)) return false;
    }

    if (q) {
      const hay = [ev.Title, ev.Organization, ev.Description, ev.City, ev.Area, ev.Region, ev.Category].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const grid = document.getElementById("grid");
  const bar  = document.getElementById("results-bar");

  if (filtered.length === 0) {
    grid.innerHTML = "";
    bar.style.display = "none";
    document.getElementById("state").style.display = "block";
    document.getElementById("state").innerHTML = `<p>No events match your filters.</p>`;
    return;
  }

  document.getElementById("state").style.display = "none";
  bar.style.display = "flex";
  document.getElementById("count-label").innerHTML =
    `<strong>${filtered.length}</strong> upcoming event${filtered.length !== 1 ? "s" : ""}`;
  grid.innerHTML = filtered.map((ev, i) => renderCard(ev, i)).join("");
}

// ── Load events from CSV ────────────────────────────────────────────────────
async function loadEvents() {
  try {
    const res = await fetch(CSV_URL + "&t=" + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const rows = parseCSV(text);

    allEvents = rows
      .map(r => { r._date = parseDate(r.Date); return r; })
      .filter(r => (r.Active || "").trim().toLowerCase() === "yes")
      .filter(r => isUpcoming(r._date))
      .sort((a, b) => a._date - b._date);

    document.getElementById("state").style.display = "none";
    buildCityChips(allEvents);
    buildRegionChips(allEvents);
    buildYearChips();
    renderMonthChips();
    render();
  } catch (err) {
    console.error(err);
    document.getElementById("state").innerHTML =
      `<p>Could not load events.</p><p style="font-size:11px;color:#c0392b;margin-top:8px;">${err.message}</p>`;
  }
}

// ── Event listeners ─────────────────────────────────────────────────────────
setupFilterTriggers();

document.getElementById("search").addEventListener("input", e => {
  searchQuery = e.target.value; render();
});

document.getElementById("topic-options").addEventListener("click", e => {
  const btn = e.target.closest("[data-cat]"); if (!btn) return;
  toggleMulti(activeCategories, btn.dataset.cat, btn, "topic");
});

document.getElementById("cost-options").addEventListener("click", e => {
  const btn = e.target.closest("[data-cost]"); if (!btn) return;
  toggleMulti(activeCosts, btn.dataset.cost, btn, "cost");
});

document.getElementById("virtual-options").addEventListener("click", e => {
  const btn = e.target.closest("[data-virtual]"); if (!btn) return;
  setVirtualState(btn.dataset.virtual);
});

document.getElementById("clear-all").addEventListener("click", () => {
  activeCategories.clear(); activeCosts.clear(); activeCities.clear(); activeRegions.clear();
  activeYears.clear(); activeMonths.clear();
  virtualState = "all";
  searchQuery = "";
  document.getElementById("search").value = "";
  document.querySelectorAll(".option").forEach(c => c.classList.remove("selected"));
  document.querySelector('[data-virtual="all"]').classList.add("selected");
  document.querySelectorAll(".filter-trigger").forEach(t => {
    t.classList.remove("active", "has-selections", "open");
    t.querySelector(".filter-count").style.display = "none";
  });
  document.querySelectorAll(".filter-panel").forEach(p => p.classList.remove("open"));
  renderMonthChips();
  render();
});

// Pass height to parent (for Showit iframe embed).
// The page lives in a fixed-size Showit embed box; on mobile that box clips
// after ~2 cards (iOS Safari also forces an iframe to its content height and
// ignores CSS height). We report the true content height to the parent so the
// matching Showit listener can grow the iframe and the page scrolls naturally.
(function() {
  let lastHeight = 0;
  function measure() {
    const b = document.body, d = document.documentElement;
    return Math.max(b.scrollHeight, b.offsetHeight, d.scrollHeight, d.offsetHeight);
  }
  function postHeight() {
    const height = measure();
    if (height === lastHeight) return; // don't spam identical values / loop resizes
    lastHeight = height;
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "juniper-calendar-height", height: height }, "*");
    }
  }
  // Initial + on resize/rotate, plus delayed sends to catch async fonts/images
  // and the CSV fetch that renders the cards after first paint.
  ["load", "resize", "orientationchange"].forEach(ev => window.addEventListener(ev, postHeight));
  [100, 400, 800, 1500, 3000].forEach(ms => setTimeout(postHeight, ms));
  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(postHeight).observe(document.body);
  } else {
    setInterval(postHeight, 750);
  }
})();

loadEvents();
</script>
